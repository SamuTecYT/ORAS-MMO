name: Build plugin and test server

# Every pull request to main (and by hand: Actions -> Run workflow). It builds the PUBLIC plugin (no
# ServerConfig.local.hpp: server 127.0.0.1), fails on new compiler warnings compared with main, runs the server tests
# and the regression suite, and checks the translations. It publishes and deploys NOTHING.
# Security: read-only token, no secrets, outside contributors need the maintainer's approval before it runs, and every
# action and the build image are pinned to an exact version (update the pins on purpose, never to a moving tag).
# Cada pull request a main (y a mano). Compila el plugin PÚBLICO, falla si hay avisos nuevos respecto a main, pasa las
# pruebas del servidor y comprueba las traducciones. No publica ni instala nada.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Translations are generated from strings.py
        run: |
          python 3ds_plugin/tools/i18n/gen_lang.py
          git diff --exit-code -- 3ds_plugin/Includes/LangTable.inc || {
            echo "::error::LangTable.inc is out of date: run python 3ds_plugin/tools/i18n/gen_lang.py and commit it"; exit 1; }
      - name: Plugin and server speak the same protocol
        run: python tools/pr_guard.py --contract-only
      - name: Guard tests
        run: python -m unittest tools/test_pr_guard.py -v

  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest server/test_server_ranking.py server/test_server_limits.py -v
      - name: Regression (framing, slow clients, old clients, 12 players at 30 Hz)
        run: python server/regression_server.py server/server.py

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      # devkitpro/devkitarm:20260610 (same as "latest" on 2026-10-21). To update: new tag AND its digest.
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - name: Main, to compare warnings
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # libctrpf and the Linux 3gxtool come from the CTRPF package repo (thepixellizeross), which does NOT sign its
      # packages: they are pinned by SHA-256 (2026-10-21; libctrpf identical, file by file, to the copy the releases are
      # built with). If upstream publishes a new version or changes a file, this step fails on purpose: check the new
      # package, then update the two hashes and names below.
      # Only that repo is synced: the image already has devkitARM and libctru, and pkg.devkitpro.org often answers 403
      # to CI runners. The temporary config keeps the [options] of the one dkp-pacman really reads.
      - name: Install libctrpf and 3gxtool (pinned by SHA-256)
        run: |
          CONF=$(dkp-pacman -v -Q 2>/dev/null | sed -n 's/^Conf File *: *//p' | head -n 1)
          [ -n "$CONF" ] || CONF=/opt/devkitpro/pacman/etc/pacman.conf
          awk '/^\[/ { keep = ($0 == "[options]") } keep' "$CONF" > /tmp/ctrpf.conf
          printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' >> /tmp/ctrpf.conf
          printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> /tmp/ctrpf.conf
          mkdir -p /tmp/pkgs
          ok=0
          for try in 1 2 3; do
            dkp-pacman --config /tmp/ctrpf.conf -Syw --noconfirm --cachedir /tmp/pkgs libctrpf 3gxtool && { ok=1; break; }
            sleep 15
          done
          [ "$ok" = 1 ]
          cd /tmp/pkgs
          cat > pinned.sha256 <<'EOF'
          af324bc6c27a5bee817bf7f3a3413b926891913254bb1d9abe09edbfb83d06b1  libctrpf-0.8.0.r1444-1-any.pkg.tar.zst
          ce691228a76e159ea14c0716f8169584a49ffcaaa1005158664567ede9dccd4c  3gxtool-1.3-1-x86_64.pkg.tar.zst
          EOF
          sha256sum -c pinned.sha256 || {
            echo "::error::libctrpf or 3gxtool changed upstream (new version or different file). Check it, then update the pinned hashes."
            ls -l /tmp/pkgs; exit 1; }
          dkp-pacman --config /tmp/ctrpf.conf -U --noconfirm libctrpf-0.8.0.r1444-1-any.pkg.tar.zst 3gxtool-1.3-1-x86_64.pkg.tar.zst

      - name: Build and count warnings (no new ones allowed)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          export PATH="${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:${PATH}"
          build() {
            test ! -f "$1/3ds_plugin/Includes/ServerConfig.local.hpp"
            make -C "$1/3ds_plugin" EXTRA_CXXFLAGS="-Wall -Wextra -Wno-unused-parameter" > "$1.log" 2>&1 || { tail -n 60 "$1.log"; return 1; }
            test -f "$1/3ds_plugin/3ds_plugin.3gx"
          }
          build pr
          now=$(grep -c "warning:" pr.log || true)
          before=$now
          if [ -d base ]; then build base; before=$(grep -c "warning:" base.log || true); fi
          echo "Compiler warnings: main $before -> this change $now" | tee -a "$GITHUB_STEP_SUMMARY"
          grep "warning:" pr.log | sed 's#^.*/3ds_plugin/##' | head -n 40 || true
          if [ "$now" -gt "$before" ]; then
            echo "::error::This change adds $((now - before)) compiler warning(s). Fix them before merging."
            exit 1
          fi
          mkdir -p out && cp pr/3ds_plugin/3ds_plugin.3gx out/OrasMmo.3gx

      # Built from the pull request's code: only for testing in a test Azahar AFTER reviewing the code. Never release it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrasMmo-3gx-test-only
          path: out/OrasMmo.3gx
          retention-days: 7
