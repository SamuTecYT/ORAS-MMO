name: Build ORAS MMO Plugin

on:
  push:
    paths:
      - 'android_mod/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CTRPluginFramework
        run: |
          apt-get update -qq
          dkp-pacman --noconfirm -Syu
          dkp-pacman --noconfirm -S 3ds-dev
          # Install CTRPluginFramework headers and library
          git clone --depth=1 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate /tmp/ctrpf_template
          cp -r /tmp/ctrpf_template/Includes /opt/devkitpro/CTRPluginFramework/
          cp -r /tmp/ctrpf_template/Libs /opt/devkitpro/CTRPluginFramework/ || true

      - name: Build .3gx plugin
        run: |
          cd android_mod
          make -j$(nproc)

      - name: Upload OrasMmo.3gx artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrasMmo-3gx
          path: android_mod/build/OrasMmo.3gx
          retention-days: 90

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "ORAS MMO Plugin - Build ${{ github.run_number }}"
          files: android_mod/build/OrasMmo.3gx
          body: |
            ## ORAS MMO Plugin - Build automático

            ### Instalación PC (Azahar Windows):
            1. Descarga `OrasMmo.3gx`
            2. Cópialo a: `[Azahar]\sdmc\luma\plugins\000400000011C400\`
            3. Activa Plugin Loader en Configuración → Sistema

            ### Instalación Android (Azahar Android):
            1. Descarga `OrasMmo.3gx`
            2. Cópialo a: `Azahar/sdmc/luma/plugins/000400000011C400/`
            3. Activa Plugin Loader en los ajustes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
