name: Build ORAS MMO 3gx

on:
  push:
    paths:
      - 'android_mod/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install official libctrpf and 3gxtool
        run: |
          echo -e "\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional" >> /etc/pacman.conf
          echo -e "\n[thepixellizeross-win]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/win\nSigLevel = Optional" >> /etc/pacman.conf
          # Using dkp-pacman inside the devkitpro container
          dkp-pacman -Sy --noconfirm libctrpf 3gxtool

      - name: Clone PabloMK7 CTRPluginFramework-BlankTemplate
        run: |
          git clone --depth=1 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate template
          
      - name: Prepare Source Files
        run: |
          cp android_mod/main.cpp template/Sources/
          cp android_mod/Entity.hpp template/Includes/
          cp android_mod/NetworkClient.hpp template/Includes/
          
      - name: Build .3gx plugin
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          export PATH="${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:${PATH}"
          cd template
          make
          
          mkdir -p ../android_mod/build
          find . -name "*.3gx" -exec cp {} ../android_mod/build/OrasMmo.3gx \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrasMmo-3gx
          path: android_mod/build/OrasMmo.3gx
          if-no-files-found: warn
          retention-days: 90
