name: Build ORAS MMO 3gx

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone CTRPluginFramework-BlankTemplate
      run: git clone https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git template

    - name: Copy Source Files
      run: |
        cp android_mod/main.cpp template/Sources/
        cp android_mod/Entity.hpp template/Includes/
        cp android_mod/NetworkClient.hpp template/Includes/

    - name: Build .3gx plugin
      run: |
        cd template
        make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrasMmo-3gx
        path: |
          template/*.3gx
          template/out/*.3gx
